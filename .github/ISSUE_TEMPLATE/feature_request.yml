name: Feature request
description: Suggest an improvement or a new capability
labels: ['enhancement', 'needs triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you run into, not just the feature.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: >
        This extension reads WhatsApp Web in your own browser and calls the
        Gemini API on request. It deliberately does not automate sending
        messages, run unattended, or bulk-message contacts.
      options:
        - label: My request does not involve sending messages automatically or without the user acting
          required: true
