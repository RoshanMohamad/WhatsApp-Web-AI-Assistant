name: Bug report
description: Something in the extension does not work as expected
labels: ['bug', 'needs triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report.

        **Please redact private conversation content.** Screenshots and pasted
        exports contain real messages, phone numbers and sometimes one-time
        passcodes. Blur or replace anything you would not post publicly.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before reporting
      options:
        - label: I am on the latest release of the extension
          required: true
        - label: I reloaded the extension and refreshed WhatsApp Web
          required: true
        - label: I have redacted any private conversation content below
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a chat with ...
        2. Click the floating AI button
        3. Choose ...
        4. See ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the extension?
      options:
        - Exporting a conversation
        - Generating an AI response
        - Settings or system instructions
        - Message detection or caching
        - The popup or help page
        - Something else / not sure
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: >
        Open DevTools on the WhatsApp Web tab (F12), reproduce the problem, and
        paste anything logged. Redact message content first.
      render: text

  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: From chrome://extensions/
      placeholder: '1.1.0'
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: 'Chrome 141 on macOS 15.2'
    validations:
      required: true
